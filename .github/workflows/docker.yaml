name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
    # ==================================================================
    # 0. 启动诊断：检查是否有上一次运行残留的 LVM / 挂载 / 占用
    #    （纯诊断，不做修改，失败也不影响后续）
    # ==================================================================
    - name: Diagnose accumulation before anything
      run: |
        echo "===== LVM ====="
        sudo pvs || true; sudo vgs || true; sudo lvs || true
        echo "===== mounts ====="
        mount | grep -E 'buildvg|docker|containerd' || true
        echo "===== loop devices ====="
        sudo losetup -a || true
        echo "===== df ====="
        df -hT
        echo "===== top dirs on / ====="
        sudo du -xhd1 / 2>/dev/null | sort -h | tail -20
        echo "===== docker/containerd dirs ====="
        sudo du -xhd1 /var/lib/docker /var/lib/containerd \
          /home/runner/.docker /home/runner/.cache 2>/dev/null | sort -h || true

    # ==================================================================
    # 1. 清理上一次运行可能残留的 LVM / 挂载（防止跨 run 累积）
    # ==================================================================
    - name: Cleanup stale LVM and mounts
      run: |
        echo "Attempting to clean stale LVM from previous runs..."
        # 先停 docker/containerd，避免持有挂载
        sudo systemctl stop docker.socket 2>/dev/null || true
        sudo systemctl stop docker 2>/dev/null || true
        sudo systemctl stop containerd 2>/dev/null || true
        sudo pkill -9 -f dockerd 2>/dev/null || true
        sudo pkill -9 -f containerd 2>/dev/null || true
        sleep 1

        # 卸载可能残留的 buildvg 挂载点
        sudo umount /var/lib/docker 2>/dev/null || true
        sudo umount -l /var/lib/docker 2>/dev/null || true

        # 删除 buildvg 卷组/逻辑卷（如果存在）
        sudo lvremove -f /dev/buildvg/buildlv 2>/dev/null || true
        sudo vgremove -f buildvg 2>/dev/null || true
        sudo pvremove -f /dev/loop* 2>/dev/null || true
        sudo losetup -D 2>/dev/null || true

        # 重建一个干净的 /var/lib/docker 目录
        sudo mkdir -p /var/lib/docker

        echo "After cleanup:"
        sudo lvs || true
        sudo losetup -a || true
        df -hT /

    # ==================================================================
    # 2. 清理预装 Docker 数据
    # ==================================================================
    - name: Clean preloaded Docker data
      run: |
        sudo systemctl start containerd 2>/dev/null || true
        sudo systemctl start docker 2>/dev/null || true
        sleep 2
        docker system df || true
        docker system prune -af --volumes || true
        docker builder prune -af --all || true
        df -hT /

    # ==================================================================
    # 3. 用纯删除方式腾空间（不创建 LVM，不碰根分区结构）
    # ==================================================================
    - name: Free disk space (remove preinstalled software, no LVM)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false          # 保留 runner 工具缓存，避免破坏 actions
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false        # Docker pull 可能需要 swap

    - name: Check disk after freeing space
      run: |
        df -hT
        docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
        docker system df -v || true

    # ==================================================================
    # 4. 诊断磁盘（保留，便于定位）
    # ==================================================================
    - name: Diagnose disk usage
      run: |
        df -hT
        df -i
        echo "---- du / ----"
        sudo du -xhd1 / 2>/dev/null | sort -h
        echo "---- du /var/lib /var/log /tmp /home /opt /usr/local ----"
        sudo du -xhd1 /var/lib /var/log /tmp /home /opt /usr/local 2>/dev/null | sort -h
        echo "---- docker dir ----"
        sudo du -xhd1 /var/lib/docker 2>/dev/null | sort -h || true

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    # ==================================================================
    # 5. Pull / Tag / Push
    # ==================================================================
    - name: Build and push image Aliyun
      shell: bash
      run: |
        set -uo pipefail

        docker system prune -af || true

        # 用 --password-stdin 避免密码出现在进程列表
        echo "$ALIYUN_REGISTRY_PASSWORD" | \
          docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # ============================================================
        # 数据预处理：判断镜像是否重名
        # ============================================================
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            line_without_rename=$(echo "$line" | sed 's/\s*->\s*.*$//')

            image=$(echo "$line_without_rename" | awk '{print $NF}')
            image="${image%%@*}"
            echo "image $image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"

            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            name_space="${name_space}_"

            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]="$name_space"
            fi
        done < images.txt

        # ============================================================
        # 逐个 pull / tag / push，每轮彻底清理
        # ============================================================
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            custom_rename=""
            if echo "$line" | grep -q '\->'; then
                custom_rename=$(echo "$line" | sed 's/.*->\s*//;s/\s*$//')
                line=$(echo "$line" | sed 's/\s*->\s*.*$//')
            fi

            echo "docker pull $line"
            docker pull $line

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"

            image=$(echo "$line" | awk '{print $NF}')

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
                if [[ -n "${name_space}" ]]; then
                    name_space_prefix="${name_space}_"
                fi
            fi

            image_name_tag="${image_name_tag%%@*}"

            if [[ -n "$custom_rename" ]]; then
                new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$custom_rename"
                echo "Using custom rename: $custom_rename"
            else
                new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            fi

            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"
            echo "docker push $new_image"
            docker push "$new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi "$image" || true
            docker rmi "$new_image" || true
            docker image prune -af || true
            # 彻底清理 buildkit / buildx 缓存，防止跨 run 累积
            docker builder prune -af --all || true
            sudo rm -rf /var/lib/docker/buildkit/* 2>/dev/null || true
            sudo rm -rf "$HOME/.docker/buildx"/* 2>/dev/null || true
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
        done < images.txt

    # ==================================================================
    # 6. 收尾：再清一次，确保本次 run 不留下任何东西
    # ==================================================================
    - name: Final cleanup
      if: always()
      run: |
        docker system prune -af --volumes || true
        docker builder prune -af --all || true
        sudo rm -rf /var/lib/docker/buildkit/* 2>/dev/null || true
        sudo rm -rf "$HOME/.docker/buildx"/* 2>/dev/null || true
        echo "Final disk state:"
        df -hT
