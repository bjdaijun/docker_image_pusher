name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    # ------------------------------------------------------------------
    # 0. 初始磁盘状态
    # ------------------------------------------------------------------
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # ------------------------------------------------------------------
    # 1. 清理预装 Docker 数据
    # ------------------------------------------------------------------
    - name: Clean preloaded Docker data
      run: |
        docker system df || true
        docker system prune -af || true
        df -hT /

    - name: Clean Docker data before resizing
      run: |
        echo "Docker usage before cleanup:"
        docker system df -v || true
        df -hT /

        docker system prune -af --volumes || true
        docker builder prune -af || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -hT /

    # ------------------------------------------------------------------
    # 2. 停掉 docker / containerd —— 关键修复
    #    避免 maximize-build-space 迁移 /var/lib/docker 时
    #    dockerd/containerd 仍持有旧文件句柄，形成 deleted-open 幽灵空间
    # ------------------------------------------------------------------
    - name: Stop docker and containerd before resize
      run: |
        echo "Stopping docker / containerd before resizing..."
        sudo systemctl stop docker.socket || true
        sudo systemctl stop docker || true
        sudo systemctl stop containerd || true
        # 确认没有残留进程
        sudo pkill -9 -f dockerd || true
        sudo pkill -9 -f containerd || true
        sleep 2
        echo "Remaining docker/containerd processes:"
        ps aux | grep -E 'dockerd|containerd' | grep -v grep || echo "none"
        df -hT /

    # ------------------------------------------------------------------
    # 3. 扩大可用磁盘空间（build-mount-path 不带尾斜杠）
    # ------------------------------------------------------------------
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 1024
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        build-mount-path: '/var/lib/docker'

    # ------------------------------------------------------------------
    # 4. 迁移后清理 deleted-open 幽灵文件 —— 关键修复
    #    如果有进程仍持有已删除文件，杀掉它们释放空间
    # ------------------------------------------------------------------
    - name: Release deleted-open files after resize
      run: |
        echo "Deleted-open files before release:"
        sudo lsof +L1 2>/dev/null | head -50 || true
        sudo lsof +L1 2>/dev/null | awk '{s+=$7} END {printf "Total deleted-open: %.2f GB\n", s/1024/1024/1024}' || true

        # 杀掉持有已删除文件的 docker/containerd 进程
        sudo lsof +L1 2>/dev/null | awk '/docker|containerd/ {print $2}' | sort -u | \
          xargs -r -n1 sudo kill -9 || true
        sleep 2

        echo "Deleted-open files after release:"
        sudo lsof +L1 2>/dev/null | awk '{s+=$7} END {printf "Total deleted-open: %.2f GB\n", s/1024/1024/1024}' || true
        df -hT /

    - name: Restart docker
      run: |
        sudo systemctl restart containerd || true
        sudo systemctl restart docker || true
        sleep 3
        docker info --format 'DockerRootDir={{.DockerRootDir}}' || true

    - name: Check Docker disk usage
      run: |
        df -hT / /var/lib/docker /var/lib/containerd || true
        docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
        docker system df -v || true

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        docker image prune -af || true
        echo "=============================================================================="

    # ------------------------------------------------------------------
    # 5. 诊断（保留，方便定位问题）
    # ------------------------------------------------------------------
    - name: Diagnose disk usage
      run: |
        df -hT
        df -i
        echo "---- du / ----"
        sudo du -xhd1 / 2>/dev/null | sort -h
        echo "---- du /var/lib /var/log /tmp /home /opt /usr/local ----"
        sudo du -xhd1 /var/lib /var/log /tmp /home /opt /usr/local 2>/dev/null | sort -h
        echo "---- du /var/lib/containerd ----"
        sudo du -xhd2 /var/lib/containerd 2>/dev/null | sort -h | tail -30
        echo "---- deleted-open files ----"
        sudo lsof +L1 2>/dev/null | awk '{s+=$7} END {printf "Total deleted-open: %.2f GB\n", s/1024/1024/1024}' || true

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    # ------------------------------------------------------------------
    # 6. Pull / Tag / Push
    # ------------------------------------------------------------------
    - name: Build and push image Aliyun
      shell: bash
      run: |
        set -uo pipefail

        docker system prune -af || true

        # 用 --password-stdin 避免密码出现在进程列表
        echo "$ALIYUN_REGISTRY_PASSWORD" | \
          docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # ============================================================
        # 数据预处理：判断镜像是否重名
        # ============================================================
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            # 移除自定义重命名部分 (->之后的内容)
            line_without_rename=$(echo "$line" | sed 's/\s*->\s*.*$//')

            image=$(echo "$line_without_rename" | awk '{print $NF}')
            image="${image%%@*}"
            echo "image $image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"

            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            name_space="${name_space}_"

            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]="$name_space"
            fi
        done < images.txt

        # ============================================================
        # 逐个 pull / tag / push，每轮清理
        # ============================================================
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            # 检查自定义重命名 (-> 分隔符)
            custom_rename=""
            if echo "$line" | grep -q '\->'; then
                custom_rename=$(echo "$line" | sed 's/.*->\s*//;s/\s*$//')
                line=$(echo "$line" | sed 's/\s*->\s*.*$//')
            fi

            echo "docker pull $line"
            docker pull $line

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"

            image=$(echo "$line" | awk '{print $NF}')

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
                if [[ -n "${name_space}" ]]; then
                    name_space_prefix="${name_space}_"
                fi
            fi

            image_name_tag="${image_name_tag%%@*}"

            if [[ -n "$custom_rename" ]]; then
                new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$custom_rename"
                echo "Using custom rename: $custom_rename"
            else
                new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            fi

            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"
            echo "docker push $new_image"
            docker push "$new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi "$image" || true
            docker rmi "$new_image" || true
            docker image prune -af || true
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
        done < images.txt
